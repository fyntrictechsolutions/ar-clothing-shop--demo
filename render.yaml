# One-click deploy of the AI try-on backend on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: thira-tryon-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FASHN_API_KEY
        sync: false
      - key: FASHN_MODE
        value: balanced
      - key: ALLOWED_ORIGINS
        value: https://fyntrictechsolutions.github.io,http://localhost:3000
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
